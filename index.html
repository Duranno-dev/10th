    verse:"이러므로 우리에게 구름 같이 둘러싼 허다한 증인들이 있으니 모든 무거운 것과 얽매이기 쉬운 죄를 벗어 버리고 인내로써 우리 앞에 당한 경주를 하며",
    ref:"히브리서 12장 1절"
  },
  {
    id:"musical", kind:"공연", kc:"k-stage",
    title:"창립기념주일 뮤지컬 The Power", sub:"창립 10주년을 노래하는 무대",
    date:"2026-12-05", dateEnd:"2026-12-06", dateLabel:"12월 5일 – 6일",
    sessions:["1차 · 12월 5일 토요일 오후 7시","2차 · 12월 6일 주일 오전 10시 30분"],
    place:"3층 본당", account:"137-006-409916",
    intro:[
      "창립기념주일을 맞아 성도들이 함께 준비한 뮤지컬 The Power를 올려드립니다.",
      "우리를 여기까지 이끄신 것은 우리의 힘이 아니라 성령의 권능이었음을 고백하며, 다음 10년도 그 능력으로 증인 되기를 꿈꿉니다."
    ],
    how:["두 번의 공연 중 편한 시간을 골라 오세요.","믿지 않는 가족과 이웃을 초대하기 좋은 자리입니다.","공연 준비를 위한 후원은 아래 계좌로 하실 수 있습니다."],
    verse:"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라",
    ref:"사도행전 1장 8절"
  }
];

const $ = s => document.querySelector(s);
const DOW = ["일","월","화","수","목","금","토"];
function todayLocal(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function d(s){const [y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd);}
function daysLeft(e){return Math.round((d(e.date)-todayLocal())/864e5);}
function isPast(e){return d(e.dateEnd||e.date)<todayLocal();}
function whenText(e){return e.sessions?e.sessions.join(" / "):[e.dateLabel,e.time].filter(Boolean).join(" ");}

function renderList(){
  let html="", month=-1;
  EVENTS.forEach(e=>{
    const dt=d(e.date);
    if(dt.getMonth()!==month){month=dt.getMonth();html+=`<div class="month">${month+1}월</div>`;}
    const day=dt.getDate()+(e.dateEnd?"·"+d(e.dateEnd).getDate():"");
    const dow=e.dateEnd?"토·주일":(DOW[dt.getDay()]==="일"?"주일":DOW[dt.getDay()]+"요일");
    const meta=e.sessions?"2회 공연 · "+e.place:[e.time,e.place].filter(Boolean).join(" · ");
    html+=`<button type="button" class="ev${isPast(e)?" past":""}" data-id="${e.id}">
      <div class="ev-date"><b style="${e.dateEnd?"font-size:22px":""}">${day}</b><span>${dow}</span></div>
      <div class="ev-body"><span class="ev-kind ${e.kc}">${e.kind}</span>
        <p class="ev-title">${e.title}</p><p class="ev-meta">${meta}</p></div>
      <span class="chev" aria-hidden="true"></span></button>`;
  });
  $("#list").innerHTML=html;
  $("#list").querySelectorAll(".ev").forEach(b=>b.onclick=()=>go(b.dataset.id));
}

function renderNext(){
  const up=EVENTS.find(e=>!isPast(e));
  const card=$("#nextCard");
  if(!up){card.innerHTML=`<div class="dday"><b>10</b></div><div><p class="next-label">함께해 주셔서 감사합니다</p><p class="next-title">창립 10주년 행사를 모두 마쳤습니다</p></div>`;card.onclick=null;return;}
  const n=daysLeft(up);
  const badge=n<=0?`<small>오늘</small><b>D-day</b>`:`<small>D-</small><b>${n}</b>`;
  card.innerHTML=`<div class="dday">${badge}</div>
    <div><p class="next-label">다가오는 행사</p><p class="next-title">${up.title}</p><p class="next-when">${up.sessions?up.dateLabel:whenText(up)}</p></div>`;
  card.onclick=()=>go(up.id);
}

function renderDetail(id){
  const i=EVENTS.findIndex(e=>e.id===id); if(i<0) return false;
  const e=EVENTS[i], prev=EVENTS[i-1], next=EVENTS[i+1];
  const whenRows=e.sessions
    ? e.sessions.map((s,k)=>`<div class="fact"><dt>${k+1}차</dt><dd>${s.split(" · ")[1]}</dd></div>`).join("")
    : `<div class="fact"><dt>날짜</dt><dd>${e.dateLabel}</dd></div>`+(e.time?`<div class="fact"><dt>시간</dt><dd>${e.time}</dd></div>`:"");
  const placeRow=e.maps
    ? `<div class="fact"><dt>장소</dt><dd>${e.maps.map(m=>`${m[0]}<a href="${m[1]}" target="_blank" rel="noopener">지도</a>`).join("<br>")}</dd></div>`
    : `<div class="fact"><dt>장소</dt><dd>${e.place}</dd></div>`;
  $("#topTitle").textContent=e.title;
  $("#detailBody").innerHTML=`
    <div class="d-head"><span class="ev-kind ${e.kc}">${e.kind}</span><h2>${e.title}</h2><p class="d-sub">${e.sub}</p></div>
    <dl class="facts">${whenRows}${placeRow}</dl>
    <div class="block"><h3>행사 소개</h3>${e.intro.map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="block"><h3>함께하는 방법</h3><ul class="steps">${e.how.map(h=>`<li>${h}</li>`).join("")}</ul></div>
    <blockquote class="word"><p>${e.verse}</p><cite>${e.ref}</cite></blockquote>
    ${e.account?`<div class="give"><div class="give-text"><small>후원계좌 · 신협</small><b>${e.account}</b></div>
      <button class="copy" type="button" data-acc="신협 ${e.account}">계좌 복사</button></div>`:""}
    <nav class="pager">
      <button type="button" ${prev?`data-id="${prev.id}"`:"disabled"}><small>이전 행사</small><span>${prev?prev.title:""}</span></button>
      <button type="button" class="nx" ${next?`data-id="${next.id}"`:"disabled"}><small>다음 행사</small><span>${next?next.title:""}</span></button>
    </nav>`;
  $("#detailBody").querySelectorAll(".pager button[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id,true));
  const c=$("#detailBody").querySelector(".copy"); if(c) c.onclick=()=>copy(c.dataset.acc,"계좌번호를 복사했습니다");
  return true;
}

function go(id,replace){ if(replace) history.replaceState(null,"","#"+id); else location.hash=id; route(); }
function route(){
  const id=location.hash.slice(1), panel=$("#detail");
  if(id && renderDetail(id)){
    panel.classList.add("open"); panel.setAttribute("aria-hidden","false"); panel.scrollTop=0;
    setTimeout(()=>$("#backBtn").focus({preventScroll:true}),320);
  } else {
    panel.classList.remove("open"); panel.setAttribute("aria-hidden","true");
  }
}
$("#backBtn").onclick=()=>{ if(history.length>1 && location.hash) history.back(); else {history.replaceState(null,"",location.pathname);route();} };
window.addEventListener("hashchange",route);

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}
function copy(text,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,()=>fallback(text,done));}
  else fallback(text,done);
}
function fallback(text,done){
  const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
  ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done();}catch(e){toast(text);} ta.remove();
}
$("#shareLink").onclick=()=>copy(location.href.split("#")[0],"페이지 주소를 복사했습니다");

renderList(); renderNext(); route();
</script>
</body>
</html>
